<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login ❤️</title>

<style>
body {
  background-color: #ffe6eb;
  background-image: url("bg1.jpg");
  background-size: cover;
  background-position: center;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 120px;
}

.box {
  background: rgba(255,255,255,0.85);
  display: inline-block;
  padding: 30px;
  border-radius: 15px;
}

input, button {
  padding: 12px;
  font-size: 18px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">
  <h1>🎂 Enter Your Birthday 🎂</h1>
  <input type="date" id="bday">
  <br>
  <button onclick="check()">Enter ❤️</button>
</div>

<script>
function check() {
  let d = document.getElementById("bday").value;
  if (d === "2005-05-20") {
    window.location.href = "love.html";
  } else {
    alert("Wrong date 😅");
  }
}
</script>

</body>
</html>
